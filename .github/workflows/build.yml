name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
              .github/scripts/plan-version.sh release CMakeLists.txt
          else
              .github/scripts/plan-version.sh ci CMakeLists.txt
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-x64
          - os: ubuntu-24.04-arm
            target: Linux-arm64
          - os: macos-15
            target: macOS-x64
            arch: x86_64
          - os: macos-15
            target: macOS-arm64
          - os: windows-2025
            target: Windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install the toolchain
        uses: lukka/get-cmake@latest

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 400M
          key: ${{ matrix.arch && format('{0}-cross', matrix.target) || matrix.target }}

      - name: Restore the libc++
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/libcxx-*
          key: libcxx-${{ matrix.target }}-${{ hashFiles('.github/scripts/select-compiler.sh') }}

      - name: Select the compiler
        shell: bash
        env:
          BASALT_TARGET_ARCH: ${{ matrix.arch }}
        run: .github/scripts/select-compiler.sh

      - name: Configure
        shell: bash
        run: eval cmake --preset release -DCMAKE_BUILD_TYPE=Release "-DBASALT_VERSION=${{ needs.plan.outputs.version }}" "-DKILN_RELEASE_PLATFORM=${{ matrix.target }}" "$BASALT_CMAKE_ARGS"

      - name: Build
        shell: bash
        run: cmake --build build/release -- -k 0

      - name: Test
        shell: bash
        run: ctest --test-dir build/release --output-on-failure

      - name: Name the binary
        shell: bash
        run: |
          mkdir dist
          if [ -f build/release/kiln.exe ]; then
              cp build/release/kiln.exe "dist/Kiln-${{ needs.plan.outputs.version }}-${{ matrix.target }}.exe"
          else
              cp build/release/kiln "dist/Kiln-${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          fi

      - name: Check the architecture
        if: matrix.arch == 'x86_64'
        shell: bash
        run: file dist/* | grep -q x86_64

      - name: Check the macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for binary in dist/*; do
              otool -L "$binary"
              if otool -L "$binary" | grep -q /opt/homebrew; then echo "$binary links Homebrew"; exit 1; fi
              otool -l "$binary" | grep -A4 LC_BUILD_VERSION | grep -q 'minos 13.0'
          done

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y rpm dpkg-dev

      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add --global WixToolset.UI.wixext/4.0.6

      - name: Package the installers
        env:
          DOTNET_ROLL_FORWARD: Major
        run: python3 scripts/package-release.py build/release dist --version ${{ needs.plan.outputs.version }} --platform ${{ matrix.target }}

      - name: Test installation and removal
        run: python3 scripts/smoke-install.py dist --version ${{ needs.plan.outputs.version }}

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: kiln-${{ matrix.target }}
          path: dist/

  freebsd:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and package on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          prepare: pkg install -y cmake ninja git llvm21 python3 pkgconf autoconf automake libtool zip unzip curl ca_root_nss patchelf
          run: |
            cmake -S . -B build/release -G Ninja -DCMAKE_C_COMPILER=clang21 -DCMAKE_CXX_COMPILER=clang++21 \
                -DCMAKE_BUILD_TYPE=Release -DBASALT_WERROR=ON -DBASALT_VERSION=${{ needs.plan.outputs.version }} \
                -DKILN_RELEASE_PLATFORM=FreeBSD-x64
            cmake --build build/release -j 3
            ctest --test-dir build/release --output-on-failure
            mkdir dist
            cp build/release/kiln dist/Kiln-${{ needs.plan.outputs.version }}-FreeBSD-x64
            python3 scripts/package-release.py build/release dist --version ${{ needs.plan.outputs.version }} --platform FreeBSD-x64
            python3 scripts/smoke-install.py dist --version ${{ needs.plan.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: kiln-FreeBSD-x64
          path: dist/

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 300M
          key: sanitize

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Configure with the address and undefined sanitizers
        run: eval cmake --preset asan "$BASALT_CMAKE_ARGS"

      - name: Build
        run: cmake --build build/asan

      - name: Test
        run: ctest --test-dir build/asan --output-on-failure

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Check formatting
        run: |
          find src \( -name '*.hpp' -o -name '*.cpp' \) -exec clang-format-19 --dry-run --Werror {} +
          clang-format-19 --dry-run --Werror test/*Test.cpp

  release:
    if: ${{ github.event_name == 'push' }}
    needs: [plan, build, freebsd, sanitize, format]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kiln-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          KILN_UPDATE_SIGNING_KEY: ${{ secrets.KILN_UPDATE_SIGNING_KEY }}
        run: .github/scripts/publish-release.sh "${{ needs.plan.outputs.version }}" "$GITHUB_SHA" artifacts
